<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
  </head>
  <body>
   <h1>Order List</h1>
<br>
    <ol>
      <li>list-1</li>
      <li>list-2</li>
      <li>list-3</li>
      <li>list-4</li>
      <li>list-5</li>
    </ol>

<h1>order list with attribute</h1>
 <br>
    <ol type="a">
      <li>list-1</li>
      <li>list-2</li>
      <li>list-3</li>
      <li>list-4</li>
      <li>list-5</li>
    </ol>

    <h1>unordered List</h1>
    <ul>
      <li>list-1</li>
      <li>list-2</li>
      <li>list-3</li>
      <li>list-4</li>
      <li>list-5</li>
    </ul>

   <h1>Description List</h1>
<br>
    <dl>
      <dt>fruits </dt>
      <dd>apple</dd>
      <dd>banana</dd>
      <dd>orange</dd>
      <dd>grapes</dd>
      <dd>strawberry</dd>
    </dl>
  </body>
</html>
